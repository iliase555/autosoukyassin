<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AutoSouk | سوق السيارات</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#f3f5f7;
    color:#17202a;
}

/* ================= HEADER ================= */

header{
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    height:75px;
    padding:0 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:28px;
    font-weight:900;
    color:#111827;
}

.logo span{
    color:#16a34a;
}

nav{
    display:flex;
    align-items:center;
    gap:25px;
}

nav a{
    text-decoration:none;
    color:#374151;
    font-weight:600;
}

.add-car{
    border:none;
    background:#16a34a;
    color:white;
    padding:12px 20px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.add-car:hover{
    background:#15803d;
}

/* ================= HERO ================= */

.hero{
    background:
    linear-gradient(rgba(17,24,39,.85),rgba(17,24,39,.92)),
    url("https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1800&q=80");

    background-size:cover;
    background-position:center;

    padding:90px 6%;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:48px;
    margin-bottom:15px;
}

.hero p{
    font-size:19px;
    color:#d1d5db;
    margin-bottom:40px;
}

/* ================= SEARCH ================= */

.search-container{
    background:white;
    max-width:1150px;
    margin:auto;
    padding:18px;
    border-radius:15px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.search-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;
    gap:10px;
}

.search-grid input,
.search-grid select{
    border:1px solid #ddd;
    padding:14px;
    border-radius:8px;
    outline:none;
    background:white;
}

.search-grid input:focus,
.search-grid select:focus{
    border-color:#16a34a;
}

.search-btn{
    border:none;
    background:#16a34a;
    color:white;
    padding:0 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
}

.search-btn:hover{
    background:#15803d;
}

/* ================= SECTION ================= */

.section{
    padding:55px 6%;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.section-title h2{
    font-size:30px;
}

.results{
    color:#6b7280;
}

/* ================= CARS ================= */

.car-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
    gap:25px;
}

.car-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    transition:.25s;
}

.car-card:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.car-image{
    width:100%;
    height:205px;
    object-fit:cover;
    display:block;
}

.car-content{
    padding:18px;
}

.car-name{
    font-size:21px;
    font-weight:bold;
    margin-bottom:8px;
}

.car-price{
    color:#16a34a;
    font-size:22px;
    font-weight:900;
    margin-bottom:12px;
}

.car-details{
    color:#6b7280;
    line-height:2;
    font-size:14px;
}

.contact-btn{
    display:block;
    margin-top:15px;
    background:#111827;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:12px;
    border-radius:8px;
}

.delete-btn{
    width:100%;
    margin-top:8px;
    border:none;
    padding:10px;
    border-radius:8px;
    background:#fee2e2;
    color:#dc2626;
    cursor:pointer;
}

/* ================= EMPTY ================= */

.empty{
    background:white;
    border-radius:15px;
    padding:60px 20px;
    text-align:center;
    color:#6b7280;
    grid-column:1/-1;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:500;
    padding:20px;
    overflow:auto;
}

.modal-box{
    background:white;
    max-width:650px;
    margin:30px auto;
    border-radius:18px;
    padding:30px;
    position:relative;
}

.close{
    position:absolute;
    left:20px;
    top:15px;
    font-size:30px;
    cursor:pointer;
    color:#6b7280;
}

.modal-title{
    text-align:center;
    font-size:27px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

.form-group input,
.form-group select{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#16a34a;
}

/* ================= IMAGE UPLOAD ================= */

.upload-box{
    border:2px dashed #16a34a;
    border-radius:12px;
    padding:25px;
    text-align:center;
    cursor:pointer;
    background:#f0fdf4;
}

.upload-box:hover{
    background:#dcfce7;
}

.upload-box input{
    display:none;
}

.upload-icon{
    font-size:40px;
    margin-bottom:10px;
}

.upload-text{
    color:#166534;
    font-weight:bold;
}

.preview{
    display:none;
    margin-top:15px;
}

.preview img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.publish-btn{
    width:100%;
    border:none;
    background:#16a34a;
    color:white;
    padding:15px;
    border-radius:9px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
}

.publish-btn:hover{
    background:#15803d;
}

/* ================= FOOTER ================= */

footer{
    background:#111827;
    color:#9ca3af;
    text-align:center;
    padding:30px;
    margin-top:40px;
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .search-grid{
        grid-template-columns:1fr 1fr;
    }

    .search-btn{
        padding:14px;
    }
}

@media(max-width:650px){

    header{
        height:auto;
        padding:15px 5%;
        flex-direction:column;
        gap:15px;
    }

    nav{
        gap:12px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .hero{
        padding:65px 5%;
    }

    .hero h1{
        font-size:32px;
    }

    .hero p{
        font-size:16px;
    }

    .search-grid{
        grid-template-columns:1fr;
    }

    .section{
        padding:40px 5%;
    }

    .section-title{
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
    }

}
</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        Auto<span>Souk</span>
    </div>

    <nav>

        <a href="#">
            الرئيسية
        </a>

        <a href="#cars">
            السيارات
        </a>

        <button class="add-car" onclick="openModal()">
            ➕ أضف سيارتك
        </button>

    </nav>

</header>


<!-- HERO -->

<section class="hero">

    <h1>
        سوق السيارات المغربي 🚗
    </h1>

    <p>
        اشترِ أو بِع سيارتك بسهولة وأمان
    </p>


    <div class="search-container">

        <div class="search-grid">

            <input
                id="searchInput"
                type="text"
                placeholder="🔎 ابحث عن الماركة أو السيارة..."
            >

            <select id="brandFilter">

                <option value="">
                    كل الماركات
                </option>

                <option>Dacia</option>
                <option>Renault</option>
                <option>Peugeot</option>
                <option>Volkswagen</option>
                <option>Mercedes</option>
                <option>BMW</option>
                <option>Ford</option>
                <option>Toyota</option>

            </select>

            <select id="cityFilter">

                <option value="">
                    كل المدن
                </option>

                <option>الرباط</option>
                <option>الدار البيضاء</option>
                <option>فاس</option>
                <option>مكناس</option>
                <option>طنجة</option>
                <option>مراكش</option>
                <option>أكادير</option>

            </select>

            <select id="fuelFilter">

                <option value="">
                    الوقود
                </option>

                <option>Diesel</option>
                <option>Essence</option>
                <option>Hybrid</option>
                <option>Electric</option>

            </select>

            <input
                id="priceFilter"
                type="number"
                placeholder="السعر الأقصى DH"
            >

            <button
                class="search-btn"
                onclick="searchCars()"
            >
                🔎 بحث
            </button>

        </div>

    </div>

</section>


<!-- CARS -->

<section
    class="section"
    id="cars"
>

    <div class="section-title">

        <h2>
            🚘 أحدث الإعلانات
        </h2>

        <div
            class="results"
            id="results"
        >
            0 سيارة
        </div>

    </div>


    <div
        class="car-grid"
        id="carGrid"
    ></div>

</section>


<!-- ADD CAR MODAL -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">

        <span
            class="close"
            onclick="closeModal()"
        >
            ×
        </span>

        <h2 class="modal-title">
            🚗 أضف سيارتك
        </h2>


        <form id="carForm">


            <div class="form-group">

                <label>
                    اسم السيارة
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="مثال: Dacia Logan"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    الماركة
                </label>

                <select id="brand" required>

                    <option value="">
                        اختر الماركة
                    </option>

                    <option>Dacia</option>
                    <option>Renault</option>
                    <option>Peugeot</option>
                    <option>Volkswagen</option>
                    <option>Mercedes</option>
                    <option>BMW</option>
                    <option>Ford</option>
                    <option>Toyota</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    السعر
                </label>

                <input
                    id="price"
                    type="number"
                    placeholder="مثال: 95000"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    سنة السيارة
                </label>

                <input
                    id="year"
                    type="number"
                    min="1980"
                    max="2026"
                    placeholder="2021"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    نوع الوقود
                </label>

                <select id="fuel" required>

                    <option value="">
                        اختر الوقود
                    </option>

                    <option>Diesel</option>
                    <option>Essence</option>
                    <option>Hybrid</option>
                    <option>Electric</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    المدينة
                </label>

                <select id="city" required>

                    <option value="">
                        اختر المدينة
                    </option>

                    <option>الرباط</option>
                    <option>الدار البيضاء</option>
                    <option>فاس</option>
                    <option>مكناس</option>
                    <option>طنجة</option>
                    <option>مراكش</option>
                    <option>أكادير</option>

                </select>

            </div>


            <!-- IMAGE -->

            <div class="form-group">

                <label>
                    صور السيارة
                </label>

                <label class="upload-box">

                    <input
                        id="imageInput"
                        type="file"
                        accept="image/*"
                        multiple
                    >

                    <div class="upload-icon">
                        📸
                    </div>

                    <div class="upload-text">
                        اضغط هنا لاختيار صور السيارة
                    </div>

                    <small>
                        يمكنك اختيار أكثر من صورة
                    </small>

                </label>


                <div
                    class="preview"
                    id="preview"
                ></div>

            </div>


            <div class="form-group">

                <label>
                    رقم الهاتف
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="+212600000000"
                    required
                >

            </div>


            <button
                class="publish-btn"
                type="submit"
            >
                🚀 نشر الإعلان
            </button>


        </form>

    </div>

</div>


<footer>

    <p>
        © 2026 AutoSouk — جميع الحقوق محفوظة
    </p>

</footer>


<script>
const SUPABASE_URL = "https://swhjooyhmypwzzarqtmx.supabase.co";

const SUPABASE_KEY = "sb_publishable_4V175zS0OOxfPVg5qBOF0Q_inAZfgfx";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
/* ===================================
   DATA
=================================== */

let cars =
JSON.parse(
    localStorage.getItem("autosoukCars")
) || [

    {
        id:1,
        name:"Dacia Logan",
        brand:"Dacia",
        price:95000,
        year:2021,
        fuel:"Diesel",
        city:"الرباط",
        phone:"+212600000000",
        image:"https://images.unsplash.com/photo-1550355291-bbee04a92027?auto=format&fit=crop&w=900&q=80"
    },

    {
        id:2,
        name:"Volkswagen Golf",
        brand:"Volkswagen",
        price:145000,
        year:2020,
        fuel:"Diesel",
        city:"الدار البيضاء",
        phone:"+212600000000",
        image:"https://images.unsplash.com/photo-1542282088-fe8426682b8f?auto=format&fit=crop&w=900&q=80"
    },

    {
        id:3,
        name:"BMW Série 3",
        brand:"BMW",
        price:230000,
        year:2019,
        fuel:"Diesel",
        city:"طنجة",
        phone:"+212600000000",
        image:"https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=900&q=80"
    }

];


/* ===================================
   DISPLAY
=================================== */

function displayCars(list){

    const grid =
        document.getElementById("carGrid");

    const results =
        document.getElementById("results");

    grid.innerHTML="";

    results.textContent =
        `${list.length} سيارة`;


    if(list.length === 0){

        grid.innerHTML=`

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    لم نجد أي سيارة
                </h3>

                <p>
                    جرّب تغيير كلمات البحث أو الفلاتر
                </p>

            </div>

        `;

        return;
    }


    list.forEach(car=>{

        const card =
            document.createElement("div");

        card.className="car-card";


        card.innerHTML=`

            <img
                class="car-image"
                src="${car.image}"
                alt="${car.name}"
            >

            <div class="car-content">

                <div class="car-name">
                    ${car.name}
                </div>

                <div class="car-price">
                    ${Number(car.price).toLocaleString("fr-FR")} DH
                </div>

                <div class="car-details">

                    📅 ${car.year}
                    <br>

                    ⛽ ${car.fuel}
                    <br>

                    📍 ${car.city}

                </div>

                <a
                    class="contact-btn"
                    href="tel:${car.phone}"
                >
                    📞 اتصل بالبائع
                </a>

                <button
                    class="delete-btn"
                    onclick="deleteCar(${car.id})"
                >
                    🗑️ حذف الإعلان
                </button>

            </div>

        `;


        grid.appendChild(card);

    });

}


/* ===================================
   SEARCH
=================================== */

function searchCars(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();


    const brand =
        document
        .getElementById("brandFilter")
        .value;


    const city =
        document
        .getElementById("cityFilter")
        .value;


    const fuel =
        document
        .getElementById("fuelFilter")
        .value;


    const maxPrice =
        parseFloat(
            document
            .getElementById("priceFilter")
            .value
        );


    const filtered =
        cars.filter(car=>{

            const text =
                (
                    car.name +
                    " " +
                    car.brand +
                    " " +
                    car.city +
                    " " +
                    car.fuel +
                    " " +
                    car.year
                ).toLowerCase();


            const searchOK =
                !search ||
                text.includes(search);


            const brandOK =
                !brand ||
                car.brand === brand;


            const cityOK =
                !city ||
                car.city === city;


            const fuelOK =
                !fuel ||
                car.fuel === fuel;


            const priceOK =
                isNaN(maxPrice) ||
                Number(car.price) <= maxPrice;


            return(
                searchOK &&
                brandOK &&
                cityOK &&
                fuelOK &&
                priceOK
            );

        });


    displayCars(filtered);

}


/* ===================================
   LIVE SEARCH
=================================== */

document
.getElementById("searchInput")
.addEventListener(
    "input",
    searchCars
);


document
.getElementById("brandFilter")
.addEventListener(
    "change",
    searchCars
);


document
.getElementById("cityFilter")
.addEventListener(
    "change",
    searchCars
);


document
.getElementById("fuelFilter")
.addEventListener(
    "change",
    searchCars
);


document
.getElementById("priceFilter")
.addEventListener(
    "input",
    searchCars
);


/* ===================================
   MODAL
=================================== */

function openModal(){

    document
    .getElementById("modal")
    .style.display="block";

}


function closeModal(){

    document
    .getElementById("modal")
    .style.display="none";

}


window.addEventListener(
    "click",
    function(e){

        const modal =
            document.getElementById("modal");

        if(e.target === modal){

            closeModal();

        }

    }
);


/* ===================================
   IMAGE UPLOAD
=================================== */

let selectedImage = "";


document
.getElementById("imageInput")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }


        if(!file.type.startsWith("image/")){

            alert("❌ اختر صورة فقط");

            return;

        }


        const reader =
            new FileReader();


        reader.onload=function(e){

            selectedImage =
                e.target.result;


            const preview =
                document
                .getElementById("preview");


            preview.style.display="block";


            preview.innerHTML=`

                <img
                    src="${selectedImage}"
                    alt="معاينة السيارة"
                >

            `;

        };


        reader.readAsDataURL(file);

    }
);


/* ===================================
   ADD CAR
=================================== */

document
.getElementById("carForm")
.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        if(!selectedImage){

            alert(
                "📸 الرجاء اختيار صورة السيارة"
            );

            return;

        }


        const newCar={

            id:Date.now(),

            name:
                document
                .getElementById("name")
                .value
                .trim(),

            brand:
                document
                .getElementById("brand")
                .value,

            price:
                Number(
                    document
                    .getElementById("price")
                    .value
                ),

            year:
                Number(
                    document
                    .getElementById("year")
                    .value
                ),

            fuel:
                document
                .getElementById("fuel")
                .value,

            city:
                document
                .getElementById("city")
                .value,

            phone:
                document
                .getElementById("phone")
                .value
                .trim(),

            image:selectedImage

        };


        cars.unshift(newCar);


        localStorage.setItem(
            "autosoukCars",
            JSON.stringify(cars)
        );


        displayCars(cars);


        document
        .getElementById("carForm")
        .reset();


        selectedImage="";


        document
        .getElementById("preview")
        .style.display="none";


        closeModal();


        document
        .getElementById("cars")
        .scrollIntoView({
            behavior:"smooth"
        });


        alert(
            "✅ تم نشر إعلان السيارة!"
        );

    }
);


/* ===================================
   DELETE
=================================== */

function deleteCar(id){

    if(
        !confirm(
            "هل أنت متأكد من حذف الإعلان؟"
        )
    ){

        return;

    }


    cars =
        cars.filter(
            car => car.id !== id
        );


    localStorage.setItem(
        "autosoukCars",
        JSON.stringify(cars)
    );


    searchCars();

}


/* ===================================
   START
=================================== */

displayCars(cars);

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>
